schema: spec-driven

context: |
  Darkfactory is a lightweight multi-agent mission system built from Claude Code
  primitives (skills, subagents, plan mode) and Codex CLI.

  It orchestrates autonomous code generation using three roles:
  - Orchestrator (Claude Code session in plan mode)
  - Workers (Codex by default, configurable)
  - Validators (Claude subagents)

  The system is built as Claude Code skills, markdown templates, and bash scripts.
  No custom IDE or app. See docs/design-decisions.md and UBIQUITOUS_LANGUAGE.md
  for full architecture and terminology.

rules:
  design:
    - design.md must include a section heading for Architecture Decision
    - design.md must include a section heading for Module Inventory
    - design.md must include a section heading for Type Catalog
    - design.md must include a section heading for Error Strategy
    - design.md must include a section heading for Integration Points
    - design.md must include a section heading for Test Strategy
  tasks:
    - Each task must produce a concrete, testable output. When the approved strategy is vertical, tasks cross all layers. When layered or hybrid, tasks may be scoped to a single layer with a clear done state and test surface.
    - One task = one worker = one commit = one validation cycle
